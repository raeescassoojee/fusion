services:
  camera-ai:
    build: .
    volumes:
      - ./media:/app/media
      - ./output:/app/output
      - ./models:/app/models
    command:
      - process
      - --input
      - media/camera_1_clip.mp4
      - --camera-id
      - CAM01
      - --mode
      - HEIGHTENED
      - --timestamp
      - "2026-07-24T21:07:00+02:00"

