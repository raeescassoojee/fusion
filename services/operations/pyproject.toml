[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-mesh-ops"
version = "0.2.0"
description = "Evidence, alerts, incident rewind, enrichment and fuel-aware routing for Discovery Sentinel Mesh"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.5,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
