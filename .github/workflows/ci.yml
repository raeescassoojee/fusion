name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0
      - run: pip install -e ".[dev]" && pip install -e "services/operations[dev]"
      - run: pytest tests
      - run: pytest services/operations/tests
      - run: ruff check services/operations/src services/operations/tests
